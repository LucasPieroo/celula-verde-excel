<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Célula Verde · Academia de Excel</title>
<meta name="description" content="Aprenda Excel do básico ao avançado praticando em uma planilha simulada, com nivelamento, trilha personalizada e progresso salvo.">
<meta name="theme-color" content="#0b5e31">
<style>
/* =========================================================
   TEMA — tokens de cor (claro e escuro), tudo em tons de verde
   ========================================================= */
:root{
  --bg:#f1f7f3; --bg-2:#e6f2ea; --surface:#ffffff; --surface-2:#f4faf6; --surface-3:#eaf5ee;
  --ink:#0e2318; --ink-2:#33544a; --muted:#5b786a; --line:#d3e6da; --line-2:#b8d8c3;
  --brand:#107c41; --brand-2:#0b5e31; --brand-3:#21a366; --brand-soft:#d9f0e1; --brand-softer:#edf8f1;
  --on-brand:#ffffff; --lime:#a6dd5f; --mint:#7fdcaa;
  --ok:#0f7a3c; --ok-bg:#e1f5e8; --ok-line:#93d4ab;
  --err:#b3261e; --err-bg:#fdecea; --err-line:#f0b6b1;
  --hint:#7a5500; --hint-bg:#fff4d4; --hint-line:#ecd086;
  --info:#125d78; --info-bg:#e3f1f6; --info-line:#a6d1e0;
  --warn-tag-bg:#fff0d2; --warn-tag:#7c5200;
  --focus:#063f22;
  --grid-head:#edf5f0; --grid-line:#dbe7df; --cell:#ffffff; --cell-ed:#f2fbe6; --hd-bg:#dff1e5; --hd-ink:#0b5e31;
  --sel-tint:rgba(16,124,65,.12); --spill:rgba(30,111,217,.07);
  --cf-red-bg:#ffc7ce; --cf-red:#9c0006; --cf-green-bg:#c6efce; --cf-green:#006100; --cf-yel-bg:#ffeb9c; --cf-yel:#7a4b00; --bar:#63be7b;
  --shadow:0 1px 2px rgba(8,40,22,.06),0 6px 18px rgba(8,40,22,.07);
  --shadow-lg:0 18px 50px rgba(8,50,28,.18);
  --radius:16px; --radius-sm:10px;
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Mono","Cascadia Code",Consolas,"SFMono-Regular",Menlo,monospace;
  --top-1:#0a4f2a; --top-2:#107c41;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1610; --bg-2:#0e1f16; --surface:#11241a; --surface-2:#142b1f; --surface-3:#183325;
    --ink:#e3f3e9; --ink-2:#b2d3bf; --muted:#88aa96; --line:#21412e; --line-2:#2d553d;
    --brand:#35c475; --brand-2:#74e3a2; --brand-3:#2aa862; --brand-soft:#173b27; --brand-softer:#122e1f;
    --on-brand:#052715; --lime:#9fd85c; --mint:#4fbf86;
    --ok:#62d995; --ok-bg:#11351f; --ok-line:#2c6b45;
    --err:#ff8f85; --err-bg:#3a1613; --err-line:#7a2e28;
    --hint:#f4cf62; --hint-bg:#33290c; --hint-line:#6d5718;
    --info:#86d2ec; --info-bg:#0f2c38; --info-line:#245669;
    --warn-tag-bg:#3a2d0c; --warn-tag:#f4cf62;
    --focus:#b9f59e;
    --grid-head:#15301f; --grid-line:#24402f; --cell:#0f2017; --cell-ed:#17311f; --hd-bg:#1b3d29; --hd-ink:#9ff0c0;
    --sel-tint:rgba(80,220,140,.16); --spill:rgba(110,170,255,.10);
    --cf-red-bg:#5b1f25; --cf-red:#ffc2c7; --cf-green-bg:#174d2a; --cf-green:#bff3cf; --cf-yel-bg:#4d3f0e; --cf-yel:#ffe8a0; --bar:#2f9e5b;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    --shadow-lg:0 18px 50px rgba(0,0,0,.45);
    --top-1:#072916; --top-2:#0c4a28;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1610; --bg-2:#0e1f16; --surface:#11241a; --surface-2:#142b1f; --surface-3:#183325;
  --ink:#e3f3e9; --ink-2:#b2d3bf; --muted:#88aa96; --line:#21412e; --line-2:#2d553d;
  --brand:#35c475; --brand-2:#74e3a2; --brand-3:#2aa862; --brand-soft:#173b27; --brand-softer:#122e1f;
  --on-brand:#052715; --lime:#9fd85c; --mint:#4fbf86;
  --ok:#62d995; --ok-bg:#11351f; --ok-line:#2c6b45;
  --err:#ff8f85; --err-bg:#3a1613; --err-line:#7a2e28;
  --hint:#f4cf62; --hint-bg:#33290c; --hint-line:#6d5718;
  --info:#86d2ec; --info-bg:#0f2c38; --info-line:#245669;
  --warn-tag-bg:#3a2d0c; --warn-tag:#f4cf62;
  --focus:#b9f59e;
  --grid-head:#15301f; --grid-line:#24402f; --cell:#0f2017; --cell-ed:#17311f; --hd-bg:#1b3d29; --hd-ink:#9ff0c0;
  --sel-tint:rgba(80,220,140,.16); --spill:rgba(110,170,255,.10);
  --cf-red-bg:#5b1f25; --cf-red:#ffc2c7; --cf-green-bg:#174d2a; --cf-green:#bff3cf; --cf-yel-bg:#4d3f0e; --cf-yel:#ffe8a0; --bar:#2f9e5b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --shadow-lg:0 18px 50px rgba(0,0,0,.45);
  --top-1:#072916; --top-2:#0c4a28;
  color-scheme:dark;
}

/* =========================================================
   BASE
   ========================================================= */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
.grid>*,.lesson>*,.mods>*,.form-grid>*{min-width:0}
.step-card h2{overflow-wrap:anywhere}
.opt>span,.pq-steps li>span{min-width:0;overflow-wrap:anywhere}
.opt code.f,.pq-steps code{word-break:break-all;white-space:normal}
.table-wrap{max-width:100%}
@media (max-width:640px){
  code.f{white-space:normal!important;word-break:break-all}
  table.simple{display:block;overflow-x:auto}
  .step-card,.card{padding:16px}
}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.55;font-size:16px;min-height:100vh}
h1,h2,h3,h4{line-height:1.2;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(1.7rem,3.6vw,2.6rem)}
h2{font-size:clamp(1.3rem,2.4vw,1.7rem)}
h3{font-size:1.12rem}
p{margin:0 0 .8em}
a{color:var(--brand-2)}
code,.mono{font-family:var(--mono);font-size:.92em}
code.f{background:var(--brand-softer);border:1px solid var(--line);color:var(--brand-2);padding:1px 6px;border-radius:6px;white-space:nowrap}
kbd{font-family:var(--mono);font-size:.8em;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--surface)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.skip{position:absolute;left:-999px;top:8px;background:var(--brand);color:var(--on-brand);padding:8px 14px;border-radius:8px;z-index:100}
.skip:focus{left:12px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.center{text-align:center}
hr.sep{border:0;border-top:1px solid var(--line);margin:18px 0}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* =========================================================
   TOPO E NAVEGAÇÃO
   ========================================================= */
.topbar{position:sticky;top:0;z-index:40;background:linear-gradient(100deg,var(--top-1),var(--top-2));color:#fff;box-shadow:0 2px 14px rgba(0,40,20,.25)}
.topbar-in{max-width:1220px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px;min-height:62px}
.topbar :focus-visible{outline-color:#d8ffb8}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;color:#fff;cursor:pointer;padding:4px;border-radius:10px;text-align:left}
.brand svg{flex:none}
.brand b{display:block;font-size:1.05rem;letter-spacing:.01em}
.brand small{display:block;font-size:.72rem;opacity:.85;letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;gap:4px;margin-left:auto}
.nav button{display:flex;align-items:center;gap:7px;background:transparent;border:0;color:#e8fff0;padding:8px 12px;border-radius:10px;cursor:pointer;font-weight:600;font-size:.92rem}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:rgba(255,255,255,.12)}
.nav button[aria-current="page"]{background:rgba(255,255,255,.2);color:#fff;box-shadow:inset 0 -2px 0 #b9f59e}
.top-right{display:flex;align-items:center;gap:8px}
.pts-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border-radius:99px;padding:5px 12px;font-weight:700;font-size:.9rem;white-space:nowrap}
.pts-chip.pulse{animation:pulse .7s ease}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.18);background:#b9f59e;color:#063f22}100%{transform:scale(1)}}
.save-ind{font-size:.75rem;opacity:.9;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.icon-btn{background:rgba(255,255,255,.14);border:0;color:#fff;width:38px;height:38px;border-radius:10px;cursor:pointer;display:grid;place-items:center}
.icon-btn:hover{background:rgba(255,255,255,.24)}
main{max-width:1220px;margin:0 auto;padding:26px 16px 110px;outline:none}
@media (max-width: 900px){
  .nav{position:fixed;left:0;right:0;bottom:0;margin:0;justify-content:space-around;background:var(--top-1);padding:6px 4px calc(6px + env(safe-area-inset-bottom));gap:0;z-index:45;box-shadow:0 -4px 18px rgba(0,30,15,.3)}
  .nav button{flex-direction:column;gap:2px;font-size:.66rem;padding:6px 4px;min-width:0;flex:1}
  .nav button svg{width:21px;height:21px}
  .save-ind{display:none}
  .brand small{display:none}
}
@media (max-width: 420px){.brand b{font-size:.95rem}.pts-chip{padding:4px 9px}}

/* =========================================================
   COMPONENTES GERAIS
   ========================================================= */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card + .card{margin-top:18px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.stack > * + *{margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--brand);color:var(--on-brand);border:0;border-radius:11px;padding:10px 18px;font-weight:650;min-height:44px;cursor:pointer;text-decoration:none;transition:background .15s,transform .1s;line-height:1.2}
.btn:hover{background:var(--brand-2)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--brand-2);border:1.5px solid var(--line-2)}
.btn.ghost:hover{background:var(--brand-softer)}
.btn.soft{background:var(--brand-soft);color:var(--brand-2)}
.btn.soft:hover{background:var(--line)}
.btn.hint{background:var(--hint-bg);color:var(--hint);border:1.5px solid var(--hint-line)}
.btn.danger{background:var(--err);color:#fff}
.btn.danger:hover{filter:brightness(.92);background:var(--err)}
.btn.sm{min-height:36px;padding:6px 13px;font-size:.88rem;border-radius:9px}
.btn.lg{min-height:52px;padding:12px 24px;font-size:1.05rem}
.btn.white{background:#fff;color:#0b5e31}
.btn.white:hover{background:#e9ffe9}
.btn.glass{background:rgba(255,255,255,.14);color:#fff;border:1.5px solid rgba(255,255,255,.45)}
.btn.glass:hover{background:rgba(255,255,255,.24)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap;letter-spacing:.01em}
.tag.aprender{background:var(--warn-tag-bg);color:var(--warn-tag)}
.tag.praticar{background:var(--info-bg);color:var(--info)}
.tag.dominado{background:var(--brand-soft);color:var(--brand-2)}
.tag.feito{background:var(--ok-bg);color:var(--ok)}
.tag.nivel{background:var(--surface-3);color:var(--ink-2)}
.bar{height:9px;background:var(--brand-softer);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand-3),var(--lime));border-radius:99px;transition:width .5s ease}
.bar.thin{height:6px}
.kicker{font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--brand)}
.lead{font-size:1.08rem;color:var(--ink-2)}
.pill-list{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}
.pill-list li{background:var(--brand-softer);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:.86rem}
.empty{padding:30px;text-align:center;color:var(--muted)}
.ex{background:var(--surface-2);border:1px dashed var(--line-2);border-radius:12px;padding:12px 14px;margin:12px 0}
.ex b.t{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--brand);margin-bottom:4px}
.tip{background:var(--info-bg);border:1px solid var(--info-line);border-radius:12px;padding:10px 14px;margin:12px 0;color:var(--ink)}
.tip::before{content:"💡 ";}
.warn{background:var(--hint-bg);border:1px solid var(--hint-line);border-radius:12px;padding:10px 14px;margin:12px 0}
.warn::before{content:"⚠️ "}
table.simple{border-collapse:collapse;width:100%;font-size:.92rem}
table.simple th,table.simple td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.simple th{background:var(--surface-3);font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}

/* Mini grade estática (ilustrações nas lições) */
.mini{border-collapse:separate;border-spacing:0;font-size:.86rem;margin:10px 0;border:1px solid var(--grid-line);border-radius:8px;overflow:hidden;background:var(--cell)}
.mini th{background:var(--grid-head);color:var(--muted);font-weight:600;font-size:.74rem;padding:3px 8px;border-right:1px solid var(--grid-line);border-bottom:1px solid var(--grid-line)}
.mini td{padding:4px 10px;border-right:1px solid var(--grid-line);border-bottom:1px solid var(--grid-line);min-width:62px;white-space:nowrap}
.mini td.n{text-align:right}
.mini td.hl{background:var(--brand-soft);box-shadow:inset 0 0 0 2px var(--brand);font-weight:700}
.mini td.h2{background:rgba(30,111,217,.12);box-shadow:inset 0 0 0 2px #1e6fd9}
.mini td.h3{background:rgba(216,27,96,.10);box-shadow:inset 0 0 0 2px #d81b60}

/* Feedback */
.fb{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:14px 16px;border:1px solid var(--line);background:var(--surface-2);margin-top:14px;animation:pop .25s ease}
.fb .ic{font-size:1.35rem;line-height:1.2;flex:none}
.fb h4{margin:0 0 4px;font-size:1rem}
.fb ol,.fb ul{margin:6px 0 0;padding-left:20px}
.fb li{margin:3px 0}
.fb.ok{background:var(--ok-bg);border-color:var(--ok-line)} .fb.ok h4{color:var(--ok)}
.fb.err{background:var(--err-bg);border-color:var(--err-line)} .fb.err h4{color:var(--err)}
.fb.hint{background:var(--hint-bg);border-color:var(--hint-line)} .fb.hint h4{color:var(--hint)}
.fb.info{background:var(--info-bg);border-color:var(--info-line)} .fb.info h4{color:var(--info)}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* Quiz */
.q-text{font-size:1.08rem;font-weight:600;margin-bottom:14px}
.opts{display:grid;gap:10px;margin:0;padding:0}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:12px 14px;border:1.5px solid var(--line-2);border-radius:13px;background:var(--surface);color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--brand-3);background:var(--brand-softer)}
.opt .lt{width:30px;height:30px;border-radius:50%;background:var(--brand-soft);color:var(--brand-2);display:grid;place-items:center;font-weight:800;flex:none;font-size:.9rem}
.opt[aria-checked="true"]{border-color:var(--brand);background:var(--brand-softer);box-shadow:0 0 0 3px var(--sel-tint)}
.opt[aria-checked="true"] .lt{background:var(--brand);color:var(--on-brand)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)} .opt.ok .lt{background:var(--ok);color:var(--surface)}
.opt.bad{border-color:var(--err);background:var(--err-bg)} .opt.bad .lt{background:var(--err);color:var(--surface)}
.opt:disabled{cursor:default}
.opt code{white-space:normal}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}

/* =========================================================
   INÍCIO (HERO)
   ========================================================= */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:clamp(26px,5vw,56px);color:#fff;
  background:
   radial-gradient(1200px 400px at 110% -20%,rgba(166,221,95,.45),transparent 60%),
   radial-gradient(700px 400px at -10% 120%,rgba(33,163,102,.55),transparent 60%),
   linear-gradient(135deg,#063f22 0%,#0b5e31 45%,#118a48 100%);
  box-shadow:var(--shadow-lg)}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:64px 30px;mask-image:linear-gradient(90deg,transparent,#000 40%,#000);-webkit-mask-image:linear-gradient(90deg,transparent,#000 40%,#000);pointer-events:none}
.hero-grid{position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:36px;align-items:center}
.hero h1{font-size:clamp(2rem,4.6vw,3.3rem);margin-bottom:14px;letter-spacing:-.02em}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#d7ff9e,#8ff0bf);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{color:#dcf7e6;font-size:1.12rem;max-width:560px}
.hero .kicker{color:#c6f7a0}
.hero-badges{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 24px;padding:0;list-style:none}
.hero-badges li{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:99px;padding:5px 12px;font-size:.85rem}
.float-sheet{background:#fff;color:#123;border-radius:16px;box-shadow:0 30px 60px rgba(0,0,0,.35);overflow:hidden;transform:rotate(-2deg);animation:flutuar 6s ease-in-out infinite}
@keyframes flutuar{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(-1deg) translateY(-8px)}}
.fs-top{display:flex;gap:6px;align-items:center;padding:8px 10px;background:#107c41;color:#fff;font-size:.78rem}
.fs-top i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.6);display:inline-block}
.fs-fx{font-family:var(--mono);font-size:.82rem;padding:7px 10px;border-bottom:1px solid #dde8e1;color:#0b5e31;white-space:nowrap;overflow:hidden}
.fs-fx .cur{display:inline-block;width:2px;height:1em;background:#0b5e31;vertical-align:middle;animation:pisca 1s steps(1) infinite}
@keyframes pisca{50%{opacity:0}}
.fs-g{display:grid;grid-template-columns:30px repeat(3,1fr);font-size:.8rem}
.fs-g span{border-right:1px solid #e3ece6;border-bottom:1px solid #e3ece6;padding:5px 8px;white-space:nowrap}
.fs-g .h{background:#eef5f0;color:#6b8576;text-align:center;font-weight:600}
.fs-g .n{text-align:right}
.fs-g .on{background:#dff3e6;box-shadow:inset 0 0 0 2px #107c41;font-weight:700;color:#0b5e31;animation:acende 3s ease-in-out infinite}
.fs-g .rg{background:rgba(30,111,217,.09)}
@keyframes acende{0%,100%{background:#dff3e6}50%{background:#c5f0a0}}
@media (max-width: 860px){.hero-grid{grid-template-columns:1fr}.float-sheet{max-width:420px}}

.feature{display:flex;gap:14px;align-items:flex-start}
.feature .fi{width:46px;height:46px;border-radius:14px;background:var(--brand-soft);color:var(--brand-2);display:grid;place-items:center;font-size:1.35rem;flex:none}
.feature h3{margin-bottom:4px}
.section-title{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:34px 0 14px}
.section-title h2{margin:0}
.continue-card{display:flex;gap:18px;align-items:center;flex-wrap:wrap;border-left:6px solid var(--brand)}
.continue-card .grow{flex:1;min-width:220px}

/* =========================================================
   NIVELAMENTO
   ========================================================= */
.pl-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.pl-head .bar{flex:1;min-width:160px}
.q-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.lvl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
.lvl{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface-2)}
.lvl .dots{display:flex;gap:5px;margin-top:8px}
.lvl .dots i{flex:1;height:7px;border-radius:9px;background:var(--line)}
.lvl .dots i.on{background:linear-gradient(90deg,var(--brand-3),var(--lime))}
.lvl b{display:block}
.result-hero{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ring{--p:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--brand-3) calc(var(--p)*1%),var(--brand-softer) 0);display:grid;place-items:center;flex:none}
.ring::before{content:"";grid-area:1/1;width:92px;height:92px;border-radius:50%;background:var(--surface)}
.ring span{grid-area:1/1;font-weight:800;font-size:1.5rem;color:var(--brand-2);z-index:1}

/* =========================================================
   TRILHA
   ========================================================= */
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.mod{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);position:relative;transition:transform .15s,box-shadow .15s}
.mod:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.mod.next{border:2px solid var(--brand);box-shadow:0 0 0 4px var(--sel-tint),var(--shadow)}
.mod .mh{display:flex;gap:12px;align-items:flex-start}
.mod .mi{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--brand-soft),var(--brand-softer));border:1px solid var(--line);display:grid;place-items:center;font-size:1.45rem;flex:none}
.mod .mn{font-size:.75rem;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.mod h3{margin:2px 0 0;font-size:1.06rem}
.mod p{color:var(--ink-2);font-size:.92rem;margin:0}
.mod .foot{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mod .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.8rem;color:var(--muted)}
.ribbon{position:absolute;top:-11px;right:16px;background:var(--brand);color:var(--on-brand);font-size:.72rem;font-weight:800;padding:3px 10px;border-radius:99px;letter-spacing:.04em}
.level-h{display:flex;align-items:center;gap:10px;margin:28px 0 12px}
.level-h h2{margin:0;font-size:1.2rem}
.level-h::after{content:"";flex:1;height:1px;background:var(--line)}

/* =========================================================
   LIÇÃO
   ========================================================= */
.lesson{display:grid;grid-template-columns:290px minmax(0,1fr);gap:22px;align-items:start}
.lesson aside{position:sticky;top:84px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.steps button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--ink-2);font-size:.9rem}
.steps button:hover{background:var(--brand-softer)}
.steps button[aria-current="step"]{background:var(--brand-soft);color:var(--brand-2);font-weight:700}
.steps .sn{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;font-size:.75rem;font-weight:800;flex:none;background:var(--surface)}
.steps .done .sn{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.steps .st{flex:1;min-width:0}
.steps .st small{display:block;font-size:.7rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.lesson-top{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.crumbs{font-size:.88rem;color:var(--muted)}
.crumbs button{background:none;border:0;color:var(--brand-2);cursor:pointer;padding:0;font-weight:600;text-decoration:underline}
.objectives{margin:8px 0 0;padding-left:20px}
.step-card h2{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.step-type{font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--brand);background:var(--brand-softer);border:1px solid var(--line);padding:3px 10px;border-radius:99px}
.step-nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.instr{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:14px}
.instr ol{margin:6px 0 0;padding-left:20px}
.instr li{margin:3px 0}
.done-badge{display:inline-flex;gap:6px;align-items:center;background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line);border-radius:99px;padding:3px 10px;font-size:.78rem;font-weight:700}
.sol{font-family:var(--mono);font-size:.88rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:8px}
@media (max-width: 900px){
  .lesson{grid-template-columns:1fr}
  .lesson aside{position:static}
  .steps{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px}
  .steps button{width:auto;white-space:nowrap}
  .steps .st small{display:none}
  .lesson aside .card{padding:14px}
}

/* =========================================================
   PLANILHA SIMULADA
   ========================================================= */
.planilha{border:1px solid var(--line-2);border-radius:14px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow);margin:6px 0}
.pl-tools{display:flex;flex-wrap:wrap;gap:3px;padding:6px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.pl-tools button{border:1px solid transparent;background:transparent;color:var(--ink-2);padding:4px 8px;border-radius:8px;cursor:pointer;display:inline-flex;gap:5px;align-items:center;min-height:32px;font-size:.82rem;font-weight:600}
.pl-tools button:hover{background:var(--brand-soft);color:var(--brand-2)}
.pl-tools .sep{width:1px;background:var(--line-2);margin:4px 3px}
.pl-fx{display:flex;align-items:stretch;border-bottom:1px solid var(--line);background:var(--surface)}
.pl-nome{width:92px;flex:none;border:0;border-right:1px solid var(--line);background:var(--surface-2);font-family:var(--mono);font-size:.86rem;padding:7px 8px;color:var(--ink);text-align:center;font-weight:700}
.pl-fxl{font-style:italic;font-family:Georgia,serif;color:var(--muted);padding:0 10px;display:flex;align-items:center;border-right:1px solid var(--line);font-weight:700}
.pl-in{flex:1;min-width:0;border:0;font-family:var(--mono);font-size:.92rem;padding:8px 10px;background:transparent;color:var(--ink)}
.pl-in:focus{outline:2px solid var(--brand);outline-offset:-2px}
.pl-in[readonly]{color:var(--muted)}
.pl-fxv{font-family:var(--mono);font-size:.84rem;padding:5px 10px;background:var(--surface-2);border-top:1px solid var(--line);white-space:pre-wrap;word-break:break-all}
.pl-fxv::before{content:"fx  ";font-style:italic;font-family:Georgia,serif;color:var(--muted);font-weight:700}
.pl-fxv:empty{display:none}
.fr{font-weight:700;border-radius:3px;padding:0 1px}
.fr0{color:#1565c0}.fr1{color:#c2185b}.fr2{color:#7b1fa2}.fr3{color:#d84315}.fr4{color:#00796b}.fr5{color:#6d4c41}
:root[data-theme="dark"] .fr0{color:#7fb8ff}:root[data-theme="dark"] .fr1{color:#ff8fbf}:root[data-theme="dark"] .fr2{color:#d7a1ff}:root[data-theme="dark"] .fr3{color:#ffab80}:root[data-theme="dark"] .fr4{color:#6fe0cf}:root[data-theme="dark"] .fr5{color:#d9b8a6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fr0{color:#7fb8ff}:root:not([data-theme="light"]) .fr1{color:#ff8fbf}:root:not([data-theme="light"]) .fr2{color:#d7a1ff}:root:not([data-theme="light"]) .fr3{color:#ffab80}:root:not([data-theme="light"]) .fr4{color:#6fe0cf}:root:not([data-theme="light"]) .fr5{color:#d9b8a6}}
.pl-info{font-size:.86rem}
.pl-info:not(:empty){padding:7px 12px;border-top:1px solid var(--line)}
.pl-info.err{background:var(--err-bg);color:var(--err)}
.pl-info.hint{background:var(--hint-bg);color:var(--hint)}
.pl-info.info{background:var(--info-bg);color:var(--info)}
.pl-info.ok{background:var(--ok-bg);color:var(--ok)}
.pl-scroll{overflow:auto;max-height:480px;background:var(--cell);position:relative}
.pl-grid{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:.9rem;user-select:none;-webkit-user-select:none;outline:none}
.pl-grid:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
.pl-grid th{background:var(--grid-head);color:var(--muted);font-weight:600;font-size:.76rem;border-right:1px solid var(--grid-line);border-bottom:1px solid var(--grid-line);padding:0 4px;position:sticky;z-index:2}
.pl-grid thead th{top:0;height:26px}
.pl-grid th.pl-rh,.pl-grid th.pl-corner{left:0}
.pl-grid th.pl-corner{z-index:3}
.pl-grid th.hs{background:var(--brand-soft);color:var(--brand-2)}
.pl-grid th.flt{color:#1565c0}
.pl-grid th.pl-ch{position:sticky;cursor:pointer}
.pl-resize{position:absolute;right:-4px;top:0;width:8px;height:100%;cursor:col-resize;z-index:3}
.pl-resize:hover{background:var(--brand-3);opacity:.5}
.pl-grid td{position:relative;height:30px;padding:0 7px;border-right:1px solid var(--grid-line);border-bottom:1px solid var(--grid-line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background-color:var(--cell);color:var(--ink);cursor:cell}
.pl-grid td .pl-v{overflow:hidden;text-overflow:ellipsis}
.pl-grid td.t-num{text-align:right}
.pl-grid td.t-bool{text-align:center}
.pl-grid td.t-err{text-align:center;color:var(--err);font-weight:700}
.pl-grid td.ed{background-color:var(--cell-ed)}
.pl-grid td.hd{background-color:var(--hd-bg);color:var(--hd-ink);font-weight:700}
.pl-grid td.b{font-weight:700}
.pl-grid td.sp{background-color:var(--spill)}
.pl-grid td.spa{box-shadow:inset 0 0 0 1px rgba(30,111,217,.55)}
.pl-grid td.in-sel{background-image:linear-gradient(var(--sel-tint),var(--sel-tint))}
.pl-grid td.rf{background-image:linear-gradient(var(--rfbg),var(--rfbg))}
.pl-grid td.rf0{--rfbg:rgba(21,101,192,.13);box-shadow:inset 0 0 0 2px #1565c0}
.pl-grid td.rf1{--rfbg:rgba(194,24,91,.12);box-shadow:inset 0 0 0 2px #c2185b}
.pl-grid td.rf2{--rfbg:rgba(123,31,162,.12);box-shadow:inset 0 0 0 2px #7b1fa2}
.pl-grid td.rf3{--rfbg:rgba(216,67,21,.12);box-shadow:inset 0 0 0 2px #d84315}
.pl-grid td.rf4{--rfbg:rgba(0,121,107,.13);box-shadow:inset 0 0 0 2px #00796b}
.pl-grid td.rf5{--rfbg:rgba(109,76,65,.13);box-shadow:inset 0 0 0 2px #6d4c41}
.pl-grid td.act{box-shadow:inset 0 0 0 2px var(--brand)!important;z-index:1}
.pl-grid td.clip{outline:2px dashed var(--brand-3);outline-offset:-3px}
.pl-grid td.fillp{outline:2px dashed var(--brand);outline-offset:-3px}
.pl-grid td.editing{overflow:visible;z-index:6}
.pl-grid td.cf-verm{background-color:var(--cf-red-bg)!important;color:var(--cf-red)!important}
.pl-grid td.cf-verde{background-color:var(--cf-green-bg)!important;color:var(--cf-green)!important}
.pl-grid td.cf-amar{background-color:var(--cf-yel-bg)!important;color:var(--cf-yel)!important}
.pl-grid td.cf-neg{font-weight:800!important}
.pl-grid tr.flt-row th.pl-rh{color:#1565c0}
.pl-cin{position:absolute;left:0;top:0;height:100%;min-width:100%;width:max(100%,260px);border:0;outline:2px solid var(--brand);padding:0 7px;font:inherit;font-family:var(--mono);font-size:.88rem;background:var(--surface);color:var(--ink);z-index:7;box-shadow:0 6px 16px rgba(0,0,0,.15)}
.pl-handle{position:absolute;right:0;bottom:0;width:10px;height:10px;background:var(--brand);border:1.5px solid var(--cell);cursor:crosshair;touch-action:none;z-index:3}
@media (pointer: coarse){.pl-handle{width:18px;height:18px}}
.pl-fbtn,.pl-vbtn{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:21px;height:21px;border:1px solid var(--line-2);background:var(--surface);border-radius:5px;font-size:10px;line-height:1;cursor:pointer;padding:0;color:var(--ink-2);display:grid;place-items:center;z-index:4}
.pl-fbtn.on{background:#1565c0;color:#fff;border-color:#1565c0}
.pl-vbtn{right:14px}
td.has-f{padding-right:28px}
.pl-status{font-size:.8rem;color:var(--muted);padding:5px 12px;background:var(--surface-2);border-top:1px solid var(--line);display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between;min-height:30px;align-items:center}
.pl-status b{color:var(--ink-2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin:6px 2px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line-2)}

/* Popover */
.pop{position:absolute;z-index:80;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow-lg);padding:8px;min-width:220px;max-width:300px;animation:pop .15s ease}
.pop h5{margin:4px 6px 8px;font-size:.85rem}
.pop .pi{display:flex;width:100%;gap:8px;align-items:center;background:none;border:0;text-align:left;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:.88rem}
.pop .pi:hover,.pop .pi:focus-visible{background:var(--brand-softer)}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.pop .plist{max-height:180px;overflow:auto;padding:2px 4px}
.pop label{display:flex;gap:8px;align-items:center;padding:4px 4px;font-size:.88rem;cursor:pointer}
.pop input[type=checkbox]{width:17px;height:17px;accent-color:var(--brand)}
.pop .pf{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}

/* Widgets */
.wbox{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface-2);margin-top:12px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px;align-items:end}
.field{display:flex;flex-direction:column;gap:5px;font-size:.85rem;font-weight:600;color:var(--ink-2)}
.field input,.field select,.inp{font:inherit;font-weight:500;padding:9px 11px;border:1.5px solid var(--line-2);border-radius:10px;background:var(--surface);color:var(--ink);min-height:42px;width:100%}
.field input:focus,.field select:focus,.inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--sel-tint)}
.chart-types{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin:12px 0}
.ctype{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;border:1.5px solid var(--line-2);border-radius:13px;background:var(--surface);cursor:pointer;font-weight:600;font-size:.88rem}
.ctype svg{width:44px;height:34px}
.ctype[aria-checked="true"]{border-color:var(--brand);background:var(--brand-softer);box-shadow:0 0 0 3px var(--sel-tint)}
.chart-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;overflow-x:auto}
.chart-box svg{display:block;width:100%;max-width:640px;height:auto;margin:0 auto}
.pv-table{border-collapse:collapse;font-size:.9rem;min-width:260px}
.pv-table th,.pv-table td{border:1px solid var(--line);padding:6px 12px}
.pv-table th{background:var(--hd-bg);color:var(--hd-ink);text-align:left}
.pv-table td.n{text-align:right;font-variant-numeric:tabular-nums}
.pv-table tr.tot td{font-weight:800;background:var(--surface-3)}
.pq-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.pq-steps li{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:.86rem}
.pq-steps li code{font-size:.75rem;color:var(--muted);display:block}
.pq-btns{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:8px}
.pq-btns button{text-align:left;justify-content:flex-start}
.pq-table{border-collapse:collapse;font-size:.88rem;width:100%}
.pq-table th,.pq-table td{border:1px solid var(--line);padding:5px 9px;white-space:pre}
.pq-table th{background:var(--hd-bg);color:var(--hd-ink);text-align:left}
.pq-table th small{font-family:var(--mono);opacity:.7;margin-right:5px}
.pq-table td.n{text-align:right}
.pq-table td.empty{background:repeating-linear-gradient(45deg,var(--surface-2),var(--surface-2) 6px,var(--surface) 6px,var(--surface) 12px)}

/* =========================================================
   PROGRESSO, CONQUISTAS, GUIA, CERTIFICADO
   ========================================================= */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font-size:1.7rem;color:var(--brand-2);line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--muted)}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px}
.ach{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.ach .ai{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;background:var(--brand-soft);flex:none}
.ach.off{opacity:.55}
.ach.off .ai{filter:grayscale(1);background:var(--surface-3)}
.ach b{display:block;font-size:.92rem}
.ach span{font-size:.78rem;color:var(--muted)}
.rank{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.rank .big{font-size:3rem;line-height:1}
.fn-cat{margin-top:22px}
.fn-name{font-family:var(--mono);font-weight:800;color:var(--brand-2)}
.cert{max-width:860px;margin:0 auto;background:var(--surface);border-radius:24px;padding:clamp(24px,5vw,56px);border:2px solid var(--brand);box-shadow:var(--shadow-lg);text-align:center;position:relative;overflow:hidden}
.cert::before{content:"";position:absolute;inset:10px;border:1px dashed var(--line-2);border-radius:18px;pointer-events:none}
.cert h1{color:var(--brand-2)}
.cert .nome{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:800;margin:8px 0 6px;color:var(--ink)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:cair 2.6s ease-in forwards}
@keyframes cair{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}

/* Toasts e modal */
.toasts{position:fixed;right:16px;bottom:18px;z-index:95;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-left:5px solid var(--brand);border-radius:12px;padding:11px 15px;box-shadow:var(--shadow-lg);max-width:340px;font-size:.92rem;transform:translateY(14px);opacity:0;transition:all .25s ease}
.toast.in{transform:none;opacity:1}
.toast.ach{border-left-color:#e2b100}
.toast.err{border-left-color:var(--err)}
@media (max-width:900px){.toasts{bottom:86px;left:12px;right:12px;align-items:stretch}.toast{max-width:none}}
.modal-bg{position:fixed;inset:0;background:rgba(3,20,10,.55);z-index:99;display:grid;place-items:center;padding:16px;animation:pop .15s ease}
.modal{background:var(--surface);color:var(--ink);border-radius:18px;padding:24px;max-width:460px;width:100%;box-shadow:var(--shadow-lg);border:1px solid var(--line)}
.modal-f{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}

@media print{
  .topbar,.nav,.no-print,.toasts{display:none!important}
  body{background:#fff}
  main{padding:0}
  .cert{box-shadow:none;border-color:#107c41}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">

'use strict';

    if (s[0] === "'") return { v: s.slice(1) };

  /* ---------- Tokenizador ---------- */
  const RE_REF = /^\$?[A-Za-z]{1,3}\$?\d+(?![A-Za-z0-9_.(À-ÿ])/;
  const RE_NOME = /^[A-Za-zÀ-ÿ_][A-Za-zÀ-ÿ0-9_.]*/;
  const RE_NUM = /^\d+(?:[.,]\d+)?(?:[eE][+-]?\d+)?/;
  const RE_ERRLIT = /^#(REF!|DIV\/0!|N\/D|VALOR!|NOME\?|NÚM!)/;
  function tokenizar(src, leniente) {
    const toks = []; let i = 0; const n = src.length;

      const ch = src[i];
      if (ch === ' ' || ch === '\t' || ch === '\n' || ch === '\r') { i++; continue; }
      const resto = src.slice(i);
      if (ch === '"') {
        let j = i + 1, v = '', fechado = false;
        while (j < n) { if (src[j] === '"') { if (src[j + 1] === '"') { v += '"'; j += 2; continue; } fechado = true; break; } v += src[j]; j++; }
        if (!fechado) { if (leniente) { toks.push({ t: 'str', v, s: i, e: n, aberto: true }); break; } throw new XLErr('#ERRO!', 'Faltou fechar as aspas de um texto. Textos ficam entre aspas, como "Sul".'); }

  const EN_PT = { SUM: 'SOMA', AVERAGE: 'MÉDIA', MIN: 'MÍNIMO', MAX: 'MÁXIMO', COUNT: 'CONT.NÚM', COUNTA: 'CONT.VALORES', IF: 'SE', AND: 'E', OR: 'OU', NOT: 'NÃO', COUNTIF: 'CONT.SE', COUNTIFS: 'CONT.SES', SUMIF: 'SOMASE', SUMIFS: 'SOMASES', AVERAGEIF: 'MÉDIASE', AVERAGEIFS: 'MÉDIASES', VLOOKUP: 'PROCV', HLOOKUP: 'PROCH', XLOOKUP: 'PROCX', INDEX: 'ÍNDICE', MATCH: 'CORRESP', IFERROR: 'SEERRO', IFS: 'SES', ROUND: 'ARRED', LEFT: 'ESQUERDA', RIGHT: 'DIREITA', MID: 'EXT.TEXTO', LEN: 'NÚM.CARACT', UPPER: 'MAIÚSCULA', LOWER: 'MINÚSCULA', PROPER: 'PRI.MAIÚSCULA', TRIM: 'ARRUMAR', TODAY: 'HOJE', DATE: 'DATA', YEAR: 'ANO', MONTH: 'MÊS', DAY: 'DIA', FILTER: 'FILTRO', UNIQUE: 'ÚNICO', SORT: 'CLASSIFICAR', SEQUENCE: 'SEQUÊNCIA', SUMPRODUCT: 'SOMARPRODUTO', TEXT: 'TEXTO', CONCATENATE: 'CONCATENAR', SUBSTITUTE: 'SUBSTITUIR', FIND: 'PROCURAR', SEARCH: 'LOCALIZAR', VALUE: 'VALOR', TEXTJOIN: 'UNIRTEXTO', MEDIAN: 'MED', LARGE: 'MAIOR', SMALL: 'MENOR', SQRT: 'RAIZ', POWER: 'POTÊNCIA', ROUNDUP: 'ARREDONDAR.PARA.CIMA', ROUNDDOWN: 'ARREDONDAR.PARA.BAIXO', WEEKDAY: 'DIA.DA.SEMANA', DAYS: 'DIAS', EOMONTH: 'FIMMÊS', ISERROR: 'ÉERROS', ISNUMBER: 'ÉNÚM', ISTEXT: 'ÉTEXTO', ISBLANK: 'ÉCÉL.VAZIA', COUNTBLANK: 'CONTAR.VAZIO', TEXTBEFORE: 'TEXTOANTES', TEXTAFTER: 'TEXTODEPOIS', NETWORKDAYS: 'DIATRABALHOTOTAL', TRUE: 'VERDADEIRO', FALSE: 'FALSO' };

  /* ---------- Analisador (precedência do Excel) ---------- */

  function analisar(src) {

  /* ---------- Cálculo ---------- */

  /* ---------- Formatação condicional ---------- */
  avaliarCF() {

    }

  }

  /* ---------- Atualização visual ---------- */
  atualizar() {

    const refs = Motor.refsDaFormula(typeof textoRef === 'string' ? textoRef : '');
    const cor = new Map();
    refs.forEach((rf, i) => { const r1 = Math.min(rf.a.r, rf.b.r), r2 = Math.max(rf.a.r, rf.b.r), c1 = Math.min(rf.a.c, rf.b.c), c2 = Math.max(rf.a.c, rf.b.c); for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) if (!cor.has(r * 1000 + c)) cor.set(r * 1000 + c, i % 6); });

        if (this.bold[ref]) cls += ' b';
        if (this.calc.dono(r, c)) cls += ' sp'; else if (this.calc.ehAncora(r, c)) cls += ' sp spa';
        if (r >= s.r1 && r <= s.r2 && c >= s.c1 && c <= s.c2 && (s.r1 !== s.r2 || s.c1 !== s.c2)) cls += ' in-sel';

  }
  avisar(html, tipo = 'info') { this.msg = { html, tipo }; this.desenharInfo(); }
  textoEdicao(r, c) {

  /* ---------- Seleção e navegação ---------- */

  mover(r, c, estender) {

  /* ---------- Mouse / toque ---------- */

  }

  }

/* ===== 8. TABELAS, CLASSIFICAÇÃO, FILTROS E VALIDAÇÃO ===== */
{ id: 'tabelas', n: 8, ic: '🗂️', titulo: 'Tabelas, filtros e validação', tema: 'filtros', lvl: 2, min: 20,
  desc: 'Organizar dados, classificar, filtrar, usar SUBTOTAL e impedir digitação errada.',
  obj: ['Estruturar dados em formato de tabela', 'Classificar e filtrar sem perder informação', 'Usar validação de dados para evitar erros'],
  skills: ['Classificar dados', 'Filtrar e usar SUBTOTAL', 'Validação de dados com lista e números'],
  steps: [
    T('Dados bem organizados', `<p>Filtros, gráficos e tabelas dinâmicas funcionam melhor com dados em <b>formato de tabela</b>:</p>
      <ul><li>Uma única linha de <b>cabeçalho</b>, com nomes claros</li><li>Cada <b>linha</b> é um registro (uma venda, um aluno)</li><li>Cada <b>coluna</b> tem um único tipo de dado</li><li><b>Sem linhas ou colunas em branco</b> no meio</li><li>Sem células mescladas</li></ul>
      <h3>Formatar como Tabela (<kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>T</kbd>)</h3>
      <p>No Excel, isso transforma o intervalo em uma <b>Tabela</b>: ganha filtros, linhas zebradas e cresce sozinha ao adicionar dados. As fórmulas passam a usar nomes, como ${f('=SOMA(Vendas[Valor])')}. Este simulador usa endereços comuns, mas a ideia é a mesma.</p>
      <h3>Classificar e filtrar</h3>
      <p><b>Dados › Classificar</b> reordena as linhas inteiras. <b>Dados › Filtro</b> (<kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>L</kbd>) coloca setas ▾ nos cabeçalhos para esconder o que você não quer ver. Nada é apagado.</p>`),
    S({ t: 'Classifique as vendas', instr: `<p>Use a seta ▾ do cabeçalho <b>Valor</b> (E1) e escolha <b>Classificar do maior para o menor</b>.</p><p class="small muted">Repare que as linhas se movem inteiras: o vendedor continua junto da sua venda.</p>`,
      pl: vendasCfg({ cols: 5, filter: 'A1:E11', start: 'E1', rows: 11 }),
      check: p => {
        const vals = range(2, 11).map(i => p.valor('E' + i));
        for (let i = 1; i < vals.length; i++) if (!(vals[i - 1] >= vals[i])) return ['A coluna Valor ainda não está em ordem decrescente (do maior para o menor).'];
        const pares = new Set(VENDAS.slice(1).map(r => r[0] + '|' + r[4]));
        if (range(2, 11).some(i => !pares.has(p.valor('A' + i) + '|' + p.valor('E' + i)))) return ['As linhas se embaralharam: cada vendedor deve continuar com o seu valor. Use Desfazer e classifique pela seta ▾.'];
        return [];
      },
      dica: 'Clique no botãozinho ▾ dentro da célula E1 e escolha "Classificar do maior para o menor".',
      exp: ['A classificação reordena as linhas inteiras com base em uma coluna.', 'A maior venda (R$ 5.600, Ana) foi para o topo.', 'No Excel, você também pode classificar por várias colunas: Dados › Classificar › Adicionar Nível.'] }),
    S({ t: 'Filtre e compare SOMA x SUBTOTAL', instr: `<ol><li>Na seta ▾ de <b>Região</b> (B1), deixe marcado apenas <b>Sul</b> e clique em OK.</li><li>Compare as células <b>H2</b> (SOMA) e <b>H3</b> (SUBTOTAL).</li></ol>`,
      pl: vendasCfg({ cols: 8, rows: 11, filter: 'A1:E11', data: Object.assign(tbl('A1', VENDAS), tbl('G1', [['Função', 'Total'], ['SOMA', '=SOMA(E2:E11)'], ['SUBTOTAL', '=SUBTOTAL(9;E2:E11)']])), fmt: { 'E2:E11': 'moeda', 'H2:H3': 'moeda' }, start: 'B1', colW: { A: 80, B: 84, C: 92, D: 54, E: 100, F: 20, G: 100, H: 110 } }),
      check: p => {
        const devem = range(2, 11).filter(i => VENDAS[i - 1][1] !== 'Sul').map(i => i - 1);
        const ocultas = [...p.ocultas].sort((a, b) => a - b);
        const regioes = range(2, 11).filter(i => !p.ocultas.has(i - 1)).map(i => p.valor('B' + i));
        if (!ocultas.length) return ['Nenhuma linha está filtrada ainda. Use a seta ▾ em B1.'];

      exp: ['Com o filtro, só as 4 vendas do Sul ficam visíveis (os números das linhas ficam azuis).', 'SOMA continua mostrando R$ 31.750,00: ela soma tudo, inclusive o que está oculto.', 'SUBTOTAL(9;...) mostra R$ 11.550,00, só as linhas visíveis. Ideal para relatórios filtrados.'] }),
    Q({ t: 'O que atrapalha?', q: 'Qual destas situações mais atrapalha filtros e classificações?', o: ['Linhas totalmente em branco no meio dos dados', 'Cabeçalho em negrito', 'Valores em formato Moeda', 'Muitas linhas de dados'], c: 0,
      dica: 'Pense em como o Excel descobre onde a tabela termina.',
      exp: ['O Excel considera que a tabela termina na primeira linha totalmente vazia.', 'Os dados abaixo dela ficam fora do filtro e da classificação, e isso gera erros silenciosos.', 'Negrito, formatos e tamanho da tabela não causam problemas.'] }),
    T('Validação de dados', `<p><b>Dados › Validação de Dados</b> define o que pode ser digitado em uma célula:</p>
      <ul><li><b>Lista</b>: só aceita itens de uma lista (Pago; Pendente; Atrasado) e mostra uma setinha para escolher.</li><li><b>Número inteiro</b> ou <b>decimal</b>: entre um mínimo e um máximo.</li><li><b>Data</b>: dentro de um período.</li><li><b>Comprimento do texto</b>: por exemplo, CPF com 11 dígitos.</li></ul>
      <p>Você também pode configurar uma <b>mensagem de entrada</b> (uma dica que aparece ao selecionar a célula) e um <b>alerta de erro</b> (que bloqueia valores inválidos).</p>
      <div class="tip">A validação evita digitações como "pago.", "PAGO " ou "Pgo", que atrapalham o CONT.SE e os filtros depois.</div>`),
    S({ t: 'Preencha com validação', instr: `<p>A coluna <b>Status</b> aceita só Pago, Pendente ou Atrasado. <b>Parcelas</b> aceita inteiros de 1 a 12. Preencha:</p>
      <table class="simple" style="max-width:420px"><tr><th>Pedido</th><th>Status</th><th>Parcelas</th></tr><tr><td>101</td><td>Pago</td><td>1</td></tr><tr><td>102</td><td>Pendente</td><td>3</td></tr><tr><td>103</td><td>Atrasado</td><td>2</td></tr><tr><td>104</td><td>Pago</td><td>12</td></tr><tr><td>105</td><td>Pendente</td><td>6</td></tr></table>
      <p class="small muted">Experimente digitar "Cancelado" ou 15 parcelas para ver o bloqueio. Nas células de Status aparece uma setinha ▼ com a lista.</p>`,
      pl: { rows: 6, cols: 4, data: tbl('A1', [['Pedido', 'Cliente', 'Status', 'Parcelas'], [101, 'Loja Sol'], [102, 'Mercado Ipê'], [103, 'Café Lua'], [104, 'Padaria Grão'], [105, 'Bazar Rio']]),
        validation: { 'C2:C6': { list: ['Pago', 'Pendente', 'Atrasado'], msgEntrada: 'Escolha um status da lista: Pago, Pendente ou Atrasado.' }, 'D2:D6': { num: { int: true, min: 1, max: 12 }, msgEntrada: 'Número inteiro de 1 a 12.', msg: 'Parcelas: digite um número inteiro de 1 a 12.' } },
        edit: 'C2:D6', start: 'C2', colW: { B: 130, C: 110 } },
      sol: { C2: 'Pago', D2: '1', C3: 'Pendente', D3: '3', C4: 'Atrasado', D4: '2', C5: 'Pago', D5: '12', C6: 'Pendente', D6: '6' }, rules: { formula: false },
      dica: 'Use a setinha ▼ que aparece na célula de Status selecionada, ou digite o texto exatamente como na lista.',
      exp: ['A validação bloqueou valores fora da lista e números fora de 1 a 12.', 'Mesmo digitando "pago" em minúsculas, o simulador gravou "Pago", padronizando o texto.', 'Dados padronizados deixam CONT.SE, filtros e tabelas dinâmicas confiáveis.'],
      evento: 'validacao' }),
    Q({ t: 'Ponto de verificação', q: 'Qual configuração de validação impede quantidades negativas ou com casas decimais?', o: ['Número inteiro maior ou igual a 0', 'Lista com os números de 0 a 1000', 'Comprimento do texto igual a 3', 'Formatação condicional'], c: 0,
      dica: 'Você quer bloquear a digitação, não apenas destacar.',
      exp: ['"Número inteiro" bloqueia valores com casas decimais.', '"Maior ou igual a 0" bloqueia negativos.', 'Formatação condicional só destaca; não impede a digitação.'] })
  ] },

/* ===== 10. PROCURA ===== */
{ id: 'procura', n: 10, ic: '🔎', titulo: 'Procura: PROCX e PROCV', tema: 'tabelas', lvl: 2, min: 20,
  desc: 'Buscar informações em tabelas, tratar itens não encontrados e trabalhar com faixas.',
  obj: ['Usar PROCV com correspondência exata', 'Usar PROCX em qualquer direção', 'Saber quando usar cada uma'],
  skills: ['PROCV exato e aproximado', 'PROCX com "não encontrado"', 'Escolher entre PROCV, PROCX e ÍNDICE/CORRESP'],
  steps: [
    T('Duas formas de procurar', `<h3>PROCV</h3><p>${f('=PROCV(valor; tabela; nº_coluna; 0)')}</p>
      <ul><li>Procura o valor na <b>primeira coluna</b> da tabela e traz a coluna de número indicado.</li><li>Só olha para a <b>direita</b>.</li><li>O <b>0</b> (ou FALSO) no final pede busca <b>exata</b>. Sem ele, a busca é aproximada!</li><li>Funciona em todas as versões do Excel.</li></ul>
      <h3>PROCX</h3><p>${f('=PROCX(valor; onde_procurar; o_que_trazer; [se_não_encontrar])')}</p>
      <ul><li>Procura em <b>qualquer coluna</b> e traz <b>qualquer outra</b>, inclusive à esquerda.</li><li>É exata por padrão e tem um argumento para "não encontrado".</li><li>Não quebra quando você insere colunas na tabela.</li><li>Disponível no Microsoft 365 e no Excel 2021 em diante.</li></ul>
      <div class="ex"><b class="t">Quando usar cada uma</b>Use <b>PROCX</b> se todos que abrem o arquivo têm Excel 365/2021+. Use <b>PROCV</b> (ou ÍNDICE + CORRESP) se o arquivo vai circular em versões antigas, como o Excel 2016.</div>`),
    S({ t: 'Busque o produto com PROCV', instr: `<p>A célula <b>F2</b> tem um código. Traga o <b>Produto</b> em G2 e o <b>Preço</b> em H2 usando PROCV.</p><p class="small muted">Depois de acertar, troque o código em F2 (ex.: P06) e veja tudo se atualizar.</p>`,
      pl: { rows: 8, cols: 8, data: Object.assign(tbl('A1', PRODUTOS), tbl('F1', [['Código', 'Produto', 'Preço'], ['P03']])), fmt: { 'C2:C8': 'moeda', H2: 'moeda' }, edit: ['F2', 'G2:H2'], start: 'G2', colW: { B: 100, E: 24 } },
      sol: { G2: '=PROCV(F2;A2:D8;2;0)', H2: '=PROCV(F2;A2:D8;3;0)' }, rules: { formula: true, fn: ['PROCV'] },
      dica: 'Produto é a 2ª coluna da tabela A2:D8; Preço é a 3ª. =PROCV(F2;A2:D8;2;0)',
      exp: ['PROCV procura "P03" na primeira coluna de A2:D8 e o encontra na 3ª linha.', 'Coluna 2 = Produto (Monitor) e coluna 3 = Preço (R$ 950,00).', 'O 0 garante correspondência exata.'] }),
    S({ t: 'PROCX para a esquerda', instr: `<p>Agora o contrário: você sabe o <b>nome</b> e quer o <b>código</b>, que está à esquerda. Use PROCX:</p><ol><li><b>G2</b>: o código do produto em F2.</li><li><b>G3</b>: o código do produto em F3. Esse produto não existe, então mostre <b>Não encontrado</b>.</li></ol>`,
      pl: { rows: 8, cols: 7, data: Object.assign(tbl('A1', PRODUTOS), tbl('F1', [['Produto', 'Código'], ['Mouse'], ['Webcam']])), fmt: { 'C2:C8': 'moeda' }, edit: ['F2:F3', 'G2:G3'], start: 'G2', colW: { B: 100, E: 24, G: 130 } },
      sol: { G2: '=PROCX(F2;B2:B8;A2:A8)', G3: '=PROCX(F3;B2:B8;A2:A8;"Não encontrado")' }, rules: { formula: true, fn: ['PROCX'] },
      dica: 'Procure o nome na coluna B e traga a coluna A: =PROCX(F2;B2:B8;A2:A8). Para o segundo, acrescente o 4º argumento: "Não encontrado".',
      exp: ['PROCV não conseguiria, porque o código está à esquerda do nome.', 'PROCX(F2;B2:B8;A2:A8) procura "Mouse" em B e traz o código correspondente de A: P02.', 'O 4º argumento evita o feio #N/D e mostra uma mensagem amigável.'] }),
    Q({ t: 'Quando não encontra', q: '<code class="f">=PROCV("P09";A2:D8;2;0)</code> não encontra o código. O que aparece e como tratar?', o: ['#N/D, que pode ser tratado com SEERRO ou com o 4º argumento do PROCX', '0, e não precisa de tratamento', '#REF!, que pode ser tratado com $', 'Uma célula vazia'], c: 0,
      dica: 'N/D significa "não disponível".',
      exp: ['PROCV devolve #N/D quando não encontra o valor.', 'Com PROCV: =SEERRO(PROCV(...);"Não encontrado").', 'Com PROCX: use o 4º argumento, sem precisar de SEERRO.'] }),
    S({ t: 'Faixas de desconto (busca aproximada)', instr: `<p>A tabela A1:B5 define faixas: a partir de R$ 1.000 → 5%, a partir de R$ 5.000 → 10%... Em <b>E2:E6</b>, descubra o desconto de cada compra.</p>`,
      pl: { rows: 6, cols: 5, data: Object.assign(tbl('A1', [['A partir de', 'Desconto'], [0, 0], [1000, 0.05], [5000, 0.1], [10000, 0.15]]), tbl('D1', [['Compra', 'Desconto'], [750], [1000], [7300], [12500], [4999]])), fmt: { 'A2:A5': 'moeda', 'B2:B5': 'pct', 'D2:D6': 'moeda', 'E2:E6': 'pct' }, edit: 'E2:E6', start: 'E2', colW: { A: 110, D: 110 } },
      sol: Object.assign({}, ...range(2, 6).map(i => ({ ['E' + i]: `=PROCV(D${i};$A$2:$B$5;2;1)` }))), rules: { formula: true },
      dica: 'Use o PROCV com correspondência aproximada (1 ou VERDADEIRO) e trave a tabela com $: =PROCV(D2;$A$2:$B$5;2;1). Alternativa: =PROCX(D2;$A$2:$A$5;$B$2:$B$5;;-1).',
      exp: ['Na busca aproximada, o PROCV encontra o maior valor que seja menor ou igual ao procurado.', 'R$ 7.300 cai na faixa "a partir de 5.000": 10%. R$ 4.999 ainda está na faixa de 1.000: 5%.', 'Para funcionar, a primeira coluna das faixas precisa estar em ordem crescente. E o $ mantém a tabela fixa ao copiar.'] }),
    Q({ t: 'Ponto de verificação', q: 'Em qual situação o <b>PROCV</b> ainda pode ser a melhor escolha?', o: ['O arquivo será aberto por colegas com Excel 2016', 'Você precisa trazer uma coluna à esquerda', 'Você quer uma mensagem quando não encontrar, sem SEERRO', 'Você vai inserir colunas no meio da tabela'], c: 0,
      dica: 'Uma das funções não existe em versões antigas.',
      exp: ['PROCX não existe no Excel 2016 ou 2019: lá apareceria #NOME?.', 'Para os outros três casos, o PROCX é superior.', 'ÍNDICE + CORRESP é uma alternativa clássica, flexível e compatível.'] })
  ] },

/* =====================================================================
   5) APLICATIVO — estado, salvamento, pontos, conquistas e telas
   ===================================================================== */
const CHAVE = 'celulaVerde.estado.v1';
const TOTAL_PASSOS = MODULOS.reduce((a, m) => a + m.steps.length, 0);
const RANKS = [{ min: 0, nome: 'Semente', ic: '🌱' }, { min: 150, nome: 'Broto', ic: '🌿' }, { min: 400, nome: 'Muda', ic: '🪴' }, { min: 800, nome: 'Árvore', ic: '🌳' }, { min: 1300, nome: 'Floresta', ic: '🌲' }];
const PTS = { quiz: [10, 5, 2], sheet: [20, 12, 6], widget: [15, 10, 5], modulo: 50, nivelCerta: 4, nivelFim: 30 };

function novoEstado() {
  return { v: 1, criado: Date.now(), savedAt: 0, nome: '', tema: 'auto', view: 'inicio', mod: null, step: 0, points: 0, streak: 0, bestStreak: 0,
    placement: { status: 'none', idx: 0, ans: {}, levels: {}, data: null }, progress: {}, sheets: {}, widgets: {}, ach: {},
    stats: { atividades: 0, formulas: 0, quizzes: 0, recuperadas: 0, lab: 0, validacao: 0 } };
}
function migrar(s) {
  const base = novoEstado(); if (!s || typeof s !== 'object') return base;
  const out = Object.assign(base, s);
  out.placement = Object.assign(novoEstado().placement, s.placement || {});
  out.stats = Object.assign(novoEstado().stats, s.stats || {});
  ['progress', 'sheets', 'widgets', 'ach'].forEach(k => { if (!out[k] || typeof out[k] !== 'object') out[k] = {}; });
  return out;
}
let armazenamentoOk = true;
function carregarEstado() {
  let local = null, emb = null;
  try { const t = localStorage.getItem(CHAVE); if (t) local = JSON.parse(t); } catch (e) { armazenamentoOk = false; }
  try { const t = (document.getElementById('estado-embutido').textContent || '').trim(); if (t && t !== 'null') emb = JSON.parse(t); } catch (e) { /* ignorado */ }
  let s = local; if (emb && (!local || (emb.savedAt || 0) > (local.savedAt || 0))) s = emb;
  return migrar(s);
}
let state = carregarEstado();
let _salvarT = null;
function salvar(imediato) {
  const ind = $('#saveInd'); if (ind) ind.textContent = '… salvando';
  clearTimeout(_salvarT);
  const fazer = () => {

  $$('[data-pq]', body).forEach(b => b.onclick = () => { w.etapas.push(b.dataset.pq); salvar(); desenhar(); });
  $('#pqUndo', body).onclick = () => { w.etapas.pop(); salvar(); desenhar(); };
  $('[data-ac="reset"]', body).onclick = () => { w.etapas = []; salvar(); desenhar(); };
  desenhar();
  const verificar = () => {
    const t = pqAplicar(step.orig, w.etapas); const a = step.alvo; const probs = [];
    if (t.cab.includes('Cliente;Cidade')) probs.push('Cliente e Cidade ainda estão na mesma coluna.');
    if (!t.cab.includes('Valor')) probs.push('A coluna Valor foi removida, mas ela é necessária. Use "Remover última" para desfazer.');
    if (t.linhas.some(r => r.every(v => VAZIO(typeof v === 'string' ? v.trim() : v)))) probs.push('Ainda há linhas em branco.');
    if (t.linhas.some(r => r.some(v => typeof v === 'string' && v !== v.replace(/ +/g, ' ').trim()))) probs.push('Ainda há espaços sobrando no início ou no fim de alguns textos.');
    const iv = t.cab.indexOf('Valor'); if (iv >= 0 && t.linhas.some(r => typeof r[iv] === 'string' && r[iv].trim())) probs.push('Os valores ainda estão como texto (ABC). Altere o tipo para número.');
    if (t.linhas.some(r => r.some(v => typeof v === 'string' && v && (v === v.toUpperCase() && /[A-Z]/.test(v) && v.length > 2 || /^[a-zà-ÿ]/.test(v))))) probs.push('Os nomes não estão padronizados (Cada Palavra Em Maiúscula).');
    const ks = t.linhas.map(r => JSON.stringify(r)); if (new Set(ks).size !== ks.length) probs.push('Há linhas duplicadas.');
    if (!probs.length && JSON.stringify(t.cab) === JSON.stringify(a.cab) && JSON.stringify(t.linhas) === JSON.stringify(a.linhas)) return [];
    if (!probs.length) probs.push('Quase! Compare o resultado com o esperado: quatro clientes, com Cliente, Cidade e Valor numérico.');
    return probs;
  };
  controlador(body, m, i, step, ss, aoConcluir, 'widget', { verificar, revelar: () => { w.etapas = ['brancos', 'dividir', 'aparar', 'capitalizar', 'tipo', 'duplicadas']; salvar(); desenhar(); }, solucaoHtml: () => '<p>Etapas: Remover linhas em branco → Dividir coluna → Aparar → Cada Palavra Em Maiúscula → Alterar tipo → Remover duplicadas.</p>' });
}

  let p = criar();

  $$('[data-id]', app).forEach(b => b.onclick = () => { const x = LAB_IDEIAS[+b.dataset.id]; p.aplicar({ [x.c]: x.f }); p.selecionar(x.c); p.focarGrade(); state.stats.lab++; verificarConquistas(); salvar(); $('#lbHost', app).scrollIntoView({ behavior: 'smooth', block: 'start' }); });

}

      <div class="card"><h3>⚠️ Erros mais comuns</h3><table class="simple">${Object.entries(Motor.ERR_MSG).filter(([k]) => k !== '#CIRC!' && k !== '#ERRO!').map(([k, v]) => `<tr><td><b>${esc(k)}</b></td><td>${esc(v)}</td></tr>`).join('')}</table></div>

  };

/* =====================================================================

    <div class="grid g2">
      <div class="card"><div class="rank"><div class="big" aria-hidden="true">${r.ic}</div><div style="flex:1;min-width:200px"><div class="kicker">Nível atual</div><h2 style="margin:0">${r.nome}</h2><p class="muted" style="margin:2px 0 8px">${state.points} pontos${nx ? ` · faltam ${nx.min - state.points} para ${nx.ic} ${nx.nome}` : ' · nível máximo!'}</p>
        <div class="bar" role="progressbar" aria-label="Progresso até o próximo nível" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${nx ? Math.round((state.points - r.min) / (nx.min - r.min) * 100) : 100}"><i style="width:${nx ? (state.points - r.min) / (nx.min - r.min) * 100 : 100}%"></i></div></div></div></div>
      <div class="card"><div class="rank"><div class="ring" style="--p:${pct};width:100px;height:100px"><span style="font-size:1.2rem">${pct}%</span></div><div><div class="kicker">Trilha</div><h2 style="margin:0">${modsFeitos()} de ${MODULOS.length} módulos</h2><p class="muted" style="margin:4px 0 10px">${passosFeitos()} de ${TOTAL_PASSOS} passos concluídos</p>${modsFeitos() === MODULOS.length ? '<button class="btn sm" data-go="conclusao">🏆 Ver certificado</button>' : '<button class="btn sm" data-go="trilha">Continuar a trilha</button>'}</div></div></div>
    </div>
    <div class="stats" style="margin-top:18px">
      <div class="stat"><b>${state.stats.atividades}</b><span>atividades concluídas</span></div>
      <div class="stat"><b>${state.stats.formulas}</b><span>exercícios com fórmula</span></div>
      <div class="stat"><b>${state.stats.quizzes}</b><span>perguntas respondidas</span></div>
      <div class="stat"><b>${state.bestStreak}</b><span>maior sequência de acertos de primeira</span></div>
      <div class="stat"><b>${nAch}/${CONQUISTAS.length}</b><span>conquistas</span></div>
    </div>
    <div class="section-title"><h2>Conquistas</h2></div>
    <div class="achs">${CONQUISTAS.map(a => `<div class="ach ${state.ach[a.id] ? '' : 'off'}"><div class="ai" aria-hidden="true">${a.ic}</div><div><b>${esc(a.nome)}</b><span>${esc(a.desc)}</span>${state.ach[a.id] ? '' : '<span class="sr"> (bloqueada)</span>'}</div></div>`).join('')}</div>
    <div class="section-title"><h2>Módulos</h2></div>
    <div class="card"><div class="table-wrap"><table class="simple"><tr><th>Módulo</th><th>Situação</th><th style="width:40%">Progresso</th></tr>${MODULOS.map(m => { const [c, t] = STATUS_TXT[statusModulo(m)]; return `<tr><td>${m.ic} <button class="btn sm ghost" data-abrir="${m.id}" style="min-height:30px;padding:3px 10px">${esc(m.titulo)}</button></td><td><span class="tag ${c}">${t}</span></td><td><div class="bar thin"><i style="width:${pctMod(m)}%"></i></div></td></tr>`; }).join('')}</table></div></div>
    ${state.placement.status === 'done' ? `<div class="section-title"><h2>Nivelamento</h2><button class="btn ghost sm" data-go="nivelamento">Ver resultado completo</button></div><div class="lvl-grid">${Object.entries(TEMAS).map(([k, n]) => `<div class="lvl"><b>${esc(n)}</b><span class="muted small">${NIVEIS[state.placement.levels[k] || 1]}</span><div class="dots">${[1, 2, 3].map(x => `<i class="${x <= (state.placement.levels[k] || 1) ? 'on' : ''}"></i>`).join('')}</div></div>`).join('')}</div>` : ''}

      <p>💾 <b>Tudo é salvo automaticamente neste navegador</b>: respostas, pontos, conquistas, a posição em cada lição e tudo o que você editou em cada planilha. Último salvamento: <b>${esc(ultimo)}</b>.</p>

      <p class="muted small">Para levar o progresso para outro computador ou navegador, baixe uma cópia do app com o seu progresso dentro, ou exporte um arquivo de backup.</p>

    }
  };
}

/* =====================================================================
   TELA: CONCLUSÃO / CERTIFICADO
   ===================================================================== */
function viewConclusao(app) {
  const completo = modsFeitos() === MODULOS.length;
  if (!completo) {
    const falta = MODULOS.filter(m => !['feito', 'validado'].includes(statusModulo(m)));
    app.innerHTML = `<div class="card center" style="max-width:760px;margin:0 auto"><div style="font-size:3rem">🌳</div><h1>Seu certificado está crescendo</h1><p class="lead">Faltam <b>${falta.length}</b> módulo(s) para concluir a trilha.</p><ul class="pill-list" style="justify-content:center;margin:14px 0">${falta.map(m => `<li>${m.ic} ${esc(m.titulo)}</li>`).join('')}</ul><button class="btn lg" data-go="trilha">Continuar a trilha</button></div>`;
    return;
  }
  const data = new Date().toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });
  const skills = MODULOS.flatMap(m => m.skills);
  app.innerHTML = `<div class="cert">
    <div class="kicker">Célula Verde · Academia de Excel</div><h1>Certificado de conclusão</h1>
    <p class="muted">Certificamos que</p><div class="nome">${esc(state.nome || 'Estudante Célula Verde')}</div>
    <p>concluiu a trilha <b>Excel do básico ao avançado</b>, com ${MODULOS.length} módulos e ${TOTAL_PASSOS} passos práticos, somando <b>${state.points} pontos</b> (nível ${rankDe(state.points).ic} ${rankDe(state.points).nome}).</p>
    <p class="muted small">${esc(data)}</p>
    <hr class="sep"><h3>Habilidades praticadas</h3><ul class="pill-list" style="justify-content:center">${skills.map(s => `<li>✔ ${esc(s)}</li>`).join('')}</ul>
    <div class="actions no-print" style="justify-content:center"><button class="btn" id="ccPrint">🖨 Imprimir ou salvar em PDF</button><button class="btn ghost" data-go="lab">🧪 Desafios livres no Laboratório</button></div>
    <p class="small muted no-print" style="margin-top:14px">Certificado de estudo emitido por este aplicativo educativo, sem validade como certificação oficial da Microsoft.</p></div>`;
  $('#ccPrint', app).onclick = () => window.print();
  if (!state.ach.certVisto) { state.ach.certVisto = Date.now(); salvar(); confete(); }
}
